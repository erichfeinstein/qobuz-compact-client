name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth
      - run: npm ci
      - run: npm run check
      - run: xvfb-run -a npm test
      - run: npm audit
